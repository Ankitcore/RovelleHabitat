<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E5E9" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#FBFBFA" />
  <rect width="1000" height="700" fill="url(#grid3)" />

  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#202A36" stroke-width="2" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#657DA0" stroke-width="0.75" />

  <!-- Title Block -->
  <g transform="translate(680, 560)">
    <rect width="285" height="105" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <rect width="285" height="24" fill="#657DA0" />
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">ROVELLE HABITAT • ARCHITECTURAL SPECIFICATION</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36">THE COURTYARD HOUSE</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">SINGLE LEVEL L-PAVILION • 2,940 SQ FT</text>
    <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">SCALE: 1:100 • ORIENTATION: EAST-WEST</text>
    <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" font-weight="600">VERIFIED ARCHITECTURAL PLAN</text>
  </g>

  <!-- North Arrow -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <path d="M 0 -22 L 6 0 L -6 0 Z" fill="#202A36" />
    <path d="M 0 22 L 6 0 L -6 0 Z" fill="#E2E5E9" />
    <text x="-4" y="-32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#202A36">N</text>
  </g>

  <!-- L-shaped Pavilion -->
  <path d="M 150 140 L 680 140 L 680 320 L 390 320 L 390 540 L 150 540 Z" fill="#FFFFFF" stroke="#202A36" stroke-width="4" />

  <!-- Internal Landscaped Courtyard -->
  <rect x="410" y="340" width="270" height="200" fill="#EEF2F8" stroke="#657DA0" stroke-width="1.5" stroke-dasharray="6,4" />
  <circle cx="545" cy="440" r="40" fill="#E2E5E9" stroke="#657DA0" stroke-width="1" />
  <text x="545" y="445" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#657DA0" text-anchor="middle">REFLECTION POND</text>
  <text x="545" y="515" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#202A36" text-anchor="middle">CENTRAL OLIVE COURTYARD</text>

  <!-- Rooms -->
  <text x="270" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">GARDEN LIVING ROOM</text>
  <text x="270" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">24&apos; × 18&apos; (10.5&apos; Ceiling)</text>

  <text x="535" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">DINING &amp; KITCHEN</text>
  <text x="535" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">20&apos; × 14&apos;</text>

  <text x="270" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">PRIMARY SUITE</text>
  <text x="270" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">19&apos; × 16&apos;</text>
  <text x="270" y="456" font-family="system-ui, sans-serif" font-size="9" fill="#68717C" text-anchor="middle">Courtyard Facing</text>
</svg>
