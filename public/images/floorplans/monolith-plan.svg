<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E5E9" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#FBFBFA" />
  <rect width="1000" height="700" fill="url(#grid)" />

  <!-- Border Frame -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#202A36" stroke-width="2" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#657DA0" stroke-width="0.75" />

  <!-- Title Block (Architectural Standard) -->
  <g transform="translate(680, 560)">
    <rect width="285" height="105" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <rect width="285" height="24" fill="#657DA0" />
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">ROVELLE HABITAT • ARCHITECTURAL SPECIFICATION</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36">THE MONOLITH RESIDENCE</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">LEVEL 1 &amp; 2 COMPOSITE LAYOUT • 4,280 SQ FT</text>
    <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">SCALE: 1:100 • ORIENTATION: SOUTH-SOUTHWEST</text>
    <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" font-weight="600">VERIFIED ARCHITECTURAL PLAN</text>
  </g>

  <!-- North Arrow -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <path d="M 0 -22 L 6 0 L -6 0 Z" fill="#202A36" />
    <path d="M 0 22 L 6 0 L -6 0 Z" fill="#E2E5E9" />
    <text x="-4" y="-32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#202A36">N</text>
  </g>

  <!-- Level 1 Perimeter Walls -->
  <!-- Exterior thick walls -->
  <rect x="140" y="140" width="480" height="400" fill="#FFFFFF" stroke="#202A36" stroke-width="4" />

  <!-- Cantilevered Garden Terrace -->
  <rect x="620" y="140" width="220" height="260" fill="#EEF2F8" stroke="#657DA0" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="730" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#657DA0" text-anchor="middle">PRIVATE GARDEN TERRACE</text>
  <text x="730" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#68717C" text-anchor="middle">Honed Limestone Pavers</text>

  <!-- Room Dividers -->
  <!-- Living Pavilion -->
  <rect x="140" y="140" width="300" height="240" fill="#FFFFFF" stroke="#202A36" stroke-width="2" />
  <text x="290" y="240" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#202A36" text-anchor="middle">GREAT LIVING PAVILION</text>
  <text x="290" y="260" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" text-anchor="middle" font-weight="600">28&apos; × 22&apos; (8.5m × 6.7m)</text>
  <text x="290" y="278" font-family="system-ui, sans-serif" font-size="10" fill="#68717C" text-anchor="middle">11.5&apos; Ceiling • European Oak Flooring</text>

  <!-- Sliding Glazing to Terrace -->
  <line x1="440" y1="160" x2="440" y2="360" stroke="#657DA0" stroke-width="3" stroke-dasharray="8,4" />
  <text x="450" y="260" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" transform="rotate(90 450 260)">GLAZED SLIDER</text>

  <!-- Dining & Culinary Gallery -->
  <rect x="440" y="140" width="180" height="240" fill="#FFFFFF" stroke="#202A36" stroke-width="2" />
  <rect x="490" y="200" width="80" height="120" fill="#F6F4EF" stroke="#202A36" stroke-width="1" />
  <text x="530" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#202A36" text-anchor="middle">CULINARY GALLERY</text>
  <text x="530" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#657DA0" text-anchor="middle" font-weight="600">21&apos; × 16&apos;</text>
  <text x="530" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#68717C" text-anchor="middle">Stone Island</text>

  <!-- Architectural Library & Study -->
  <rect x="140" y="380" width="200" height="160" fill="#FFFFFF" stroke="#202A36" stroke-width="2" />
  <text x="240" y="450" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#202A36" text-anchor="middle">LIBRARY &amp; STUDY</text>
  <text x="240" y="468" font-family="system-ui, sans-serif" font-size="10" fill="#657DA0" text-anchor="middle" font-weight="600">15&apos; × 13&apos;</text>
  <text x="240" y="485" font-family="system-ui, sans-serif" font-size="9" fill="#68717C" text-anchor="middle">Acoustic Insulated</text>

  <!-- Entry Vestibule & Staircase -->
  <rect x="340" y="380" width="140" height="160" fill="#FFFFFF" stroke="#202A36" stroke-width="2" />
  <text x="410" y="430" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202A36" text-anchor="middle">ENTRY FOYER</text>
  <!-- Stair treads -->
  <g stroke="#202A36" stroke-width="1">
    <line x1="360" y1="450" x2="460" y2="450" />
    <line x1="360" y1="462" x2="460" y2="462" />
    <line x1="360" y1="474" x2="460" y2="474" />
    <line x1="360" y1="486" x2="460" y2="486" />
    <line x1="360" y1="498" x2="460" y2="498" />
    <line x1="360" y1="510" x2="460" y2="510" />
  </g>
  <text x="410" y="528" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" text-anchor="middle">STAIRS TO LEVEL 2</text>

  <!-- Powder & Cloakroom -->
  <rect x="480" y="380" width="140" height="160" fill="#FFFFFF" stroke="#202A36" stroke-width="2" />
  <text x="550" y="450" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202A36" text-anchor="middle">GUEST BATH</text>
  <text x="550" y="468" font-family="system-ui, sans-serif" font-size="9" fill="#68717C" text-anchor="middle">Stone Vanity</text>

  <!-- Dimension Markers -->
  <!-- Top dimension line -->
  <line x1="140" y1="120" x2="620" y2="120" stroke="#68717C" stroke-width="1" />
  <line x1="140" y1="112" x2="140" y2="128" stroke="#68717C" stroke-width="1" />
  <line x1="620" y1="112" x2="620" y2="128" stroke="#68717C" stroke-width="1" />
  <text x="380" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#68717C" text-anchor="middle">49&apos; - 0&quot; (14.9m)</text>

  <!-- Left dimension line -->
  <line x1="115" y1="140" x2="115" y2="540" stroke="#68717C" stroke-width="1" />
  <line x1="107" y1="140" x2="123" y2="140" stroke="#68717C" stroke-width="1" />
  <line x1="107" y1="540" x2="123" y2="540" stroke="#68717C" stroke-width="1" />
  <text x="105" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#68717C" text-anchor="middle" transform="rotate(-90 105 345)">40&apos; - 0&quot; (12.2m)</text>
</svg>
