<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E5E9" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#FBFBFA" />
  <rect width="1000" height="700" fill="url(#grid4)" />

  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#202A36" stroke-width="2" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#657DA0" stroke-width="0.75" />

  <!-- Title Block -->
  <g transform="translate(680, 560)">
    <rect width="285" height="105" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <rect width="285" height="24" fill="#657DA0" />
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">ROVELLE HABITAT • ARCHITECTURAL SPECIFICATION</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36">THE MARINA TERRACE</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">THREE-LEVEL TOWNHOME • 3,120 SQ FT</text>
    <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">SCALE: 1:100 • ORIENTATION: NORTHWEST</text>
    <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" font-weight="600">VERIFIED ARCHITECTURAL PLAN</text>
  </g>

  <!-- North Arrow -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <path d="M 0 -22 L 6 0 L -6 0 Z" fill="#202A36" />
    <path d="M 0 22 L 6 0 L -6 0 Z" fill="#E2E5E9" />
    <text x="-4" y="-32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#202A36">N</text>
  </g>

  <!-- Marina Townhome Layout -->
  <rect x="180" y="140" width="460" height="400" fill="#FFFFFF" stroke="#202A36" stroke-width="4" />

  <!-- Rooftop Terrace -->
  <rect x="640" y="140" width="180" height="260" fill="#EEF2F8" stroke="#657DA0" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="730" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#657DA0" text-anchor="middle">ROOFTOP CEDAR DECK</text>
  <text x="730" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#68717C" text-anchor="middle">Bay Outlook &amp; Grill</text>

  <!-- Rooms -->
  <text x="410" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">LEVEL 2 LIVING &amp; TERRACE</text>
  <text x="410" y="260" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">24&apos; × 17&apos; (10.8&apos; Ceiling)</text>

  <text x="410" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">PRIMARY SUITE LEVEL 3</text>
  <text x="410" y="460" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">20&apos; × 15&apos;</text>
</svg>
