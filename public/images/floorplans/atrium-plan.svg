<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E5E9" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#FBFBFA" />
  <rect width="1000" height="700" fill="url(#grid2)" />

  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#202A36" stroke-width="2" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#657DA0" stroke-width="0.75" />

  <!-- Title Block -->
  <g transform="translate(680, 560)">
    <rect width="285" height="105" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <rect width="285" height="24" fill="#657DA0" />
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">ROVELLE HABITAT • ARCHITECTURAL SPECIFICATION</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36">THE ATRIUM PENTHOUSE</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">PENTHOUSE LEVEL • 3,650 SQ FT</text>
    <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#68717C">SCALE: 1:100 • ORIENTATION: NORTH-WEST</text>
    <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#657DA0" font-weight="600">VERIFIED ARCHITECTURAL PLAN</text>
  </g>

  <!-- North Arrow -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#202A36" stroke-width="1.5" />
    <path d="M 0 -22 L 6 0 L -6 0 Z" fill="#202A36" />
    <path d="M 0 22 L 6 0 L -6 0 Z" fill="#E2E5E9" />
    <text x="-4" y="-32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#202A36">N</text>
  </g>

  <!-- Penthouse Perimeter -->
  <rect x="150" y="130" width="500" height="420" fill="#FFFFFF" stroke="#202A36" stroke-width="4" />

  <!-- Perimeter Sky Deck -->
  <rect x="650" y="130" width="180" height="420" fill="#EEF2F8" stroke="#657DA0" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="740" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#657DA0" text-anchor="middle">PERIMETER SKY DECK</text>
  <text x="740" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#68717C" text-anchor="middle">Limestone &amp; Planters</text>

  <!-- Central Glass Atrium Lantern -->
  <rect x="330" y="270" width="140" height="140" fill="#EEF2F8" stroke="#657DA0" stroke-width="3" stroke-dasharray="8,4" />
  <text x="400" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#657DA0" text-anchor="middle">CENTRAL GLASS</text>
  <text x="400" y="352" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#657DA0" text-anchor="middle">ATRIUM LANTERN</text>
  <text x="400" y="370" font-family="system-ui, sans-serif" font-size="9" fill="#68717C" text-anchor="middle">Open to Sky</text>

  <!-- Rooms -->
  <text x="240" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">ATRIUM LIVING LOUNGE</text>
  <text x="240" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">26&apos; × 20&apos; (14.0&apos; Ceiling)</text>

  <text x="560" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">CHEF DINING SUITE</text>
  <text x="560" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">22&apos; × 15&apos;</text>

  <text x="240" y="470" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202A36" text-anchor="middle">PRIMARY SUITE</text>
  <text x="240" y="488" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">22&apos; × 17&apos; with Dressing Gallery</text>

  <text x="560" y="470" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#202A36" text-anchor="middle">GUEST SUITE</text>
  <text x="560" y="488" font-family="system-ui, sans-serif" font-size="11" fill="#657DA0" font-weight="600" text-anchor="middle">16&apos; × 14&apos;</text>

  <!-- Dimensions -->
  <line x1="150" y1="110" x2="650" y2="110" stroke="#68717C" stroke-width="1" />
  <text x="400" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#68717C" text-anchor="middle">52&apos; - 0&quot; (15.8m)</text>
</svg>
